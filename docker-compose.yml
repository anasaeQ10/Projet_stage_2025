version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vscanner_mysql
    restart: always
    environment:
      MYSQL_DATABASE: vscanner_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8889:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vscanner-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: vscanner_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/vscanner_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vscanner-net

volumes:
  mysql_data:

networks:
  vscanner-net:
    driver: bridge
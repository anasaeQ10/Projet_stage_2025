version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: mysqldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "8889:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: vulnerability-scanner-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysqldb
    environment:
      # Connexion à la base de données via le nom de service Docker 'mysqldb'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Configuration de l'API NVD (v2.0)
      NVD_API_KEY: ${NVD_API_KEY}
      NVD_API_BASE_URL: https://services.nvd.nist.gov/rest/json/cves/1.0

      # Configuration du service Mailtrap
      SPRING_MAIL_HOST: smtp.mailtrap.io
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

volumes:
  mysql_data: